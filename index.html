<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CWGC 班別課堂查詢" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260915-5" />
    <title>CWGC 班別課堂查詢</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <div class="mark" aria-hidden="true">CW</div>
        <div>
          <p class="eyebrow">2026–2027</p>
          <h1>班別課堂查詢</h1>
        </div>
      </header>

      <nav class="mode-nav" aria-label="查詢方式">
        <a class="active" aria-current="page" href="index.html">按班別查詢</a>
        <a href="classroom.html">按課室查詢</a>
        <a href="teacher.html">按教師查詢</a>
        <a href="combined.html">同時查詢</a>
      </nav>

      <section class="search-card" aria-labelledby="search-heading">
        <div class="card-heading">
          <h2 id="search-heading">查詢課堂</h2>
          <p>輸入班別；時間或節次可選填。</p>
        </div>

        <form id="query-form" novalidate>
          <fieldset class="season-choice">
            <legend>時間制度</legend>
            <label><input type="radio" name="season" value="winter" checked /> 冬令時間</label>
            <label><input type="radio" name="season" value="summer" /> 夏令時間</label>
          </fieldset>

          <div class="form-grid">
            <label for="class-input">班別
              <input id="class-input" name="className" autocomplete="off" placeholder="例如 1A、6d" maxlength="2" required />
            </label>
            <div class="weekday-field">
              <p id="today-reminder" class="weekday-reminder" role="status"></p>
              <label for="day-select">星期
                <select id="day-select" name="day" required>
                  <option value="Mon">星期一</option>
                  <option value="Tue">星期二</option>
                  <option value="Wed">星期三</option>
                  <option value="Thu">星期四</option>
                  <option value="Fri">星期五</option>
                </select>
              </label>
            </div>
            <label for="time-input">時間或節次
              <input id="time-input" name="timeOrPeriod" autocomplete="off" placeholder="選填：830、8:30、1、第一節" />
            </label>
            <button type="submit">搜尋課堂</button>
          </div>
        </form>
      </section>

      <p id="data-status" class="data-status" role="status">正在載入已核對課表資料…</p>
      <section id="result" class="result-panel" aria-live="polite" hidden></section>

      <section class="guide" aria-labelledby="guide-heading">
        <h2 id="guide-heading">輸入提示</h2>
        <ul>
          <li>班別不分大小寫，例如 <code>1a</code> 會視為 <code>1A</code>。</li>
          <li>只輸入班別即可查看班主任、班課室、級別統籌及當天時間表。時間可輸入 <code>830</code> 或 <code>8:30</code>；節次可輸入 <code>1</code>、<code>一</code> 或 <code>第一節</code>。</li>
          <li>輸入不存在的班別、無效時間或無效節次時，會顯示「輸入錯誤資料無法搜索」。</li>
        </ul>
      </section>
    </main>
    <script type="module" src="app.js?v=20260916-2"></script>
  </body>
</html>
